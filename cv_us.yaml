summary: |
  with 15+ years of experience designing, evolving, and scaling
  distributed backend systems used by global enterprise customers.
  Experienced in owning large, business-critical components within team-owned architectures,
  with a strong focus on reliability, scalability, and long-term maintainability.
  Specialized in Kotlin/Java ecosystems, event-driven systems, and data-intensive platforms.

accomplishments:
  - title: LARGE-SCALE REPORTING REDESIGN FOR GLOBAL VMS
    description: |
      Owned the design and evolution of a large, business-critical reporting component
      within a global Vendor Management System used by enterprise customers
      (10k–100k+ users, including Fortune 500 clients).
      Replaced a memory-heavy synchronous export mechanism with an asynchronous,
      streaming-based design capable of handling large data volumes reliably
      with a minimal memory footprint.
      While team ownership boundaries remained intact, changes to the reporting component
      had cross-team impact and required careful coordination.
      The solution was delivered incrementally with zero customer disruption and
      supports flexible report configuration including column selection,
      reordering, and renaming.
    technologies:
      - Kotlin
      - Java
      - Spring
      - PostgreSQL
      - Kafka
      - ActiveMQ
      - Kubernetes
      - GraphQL

  - title: HIGH-THROUGHPUT TELECOMMUNICATIONS TRACE ANALYTICS PLATFORM
    description: |
      Designed and built a high-throughput analytics platform processing thousands of
      telecommunications trace events per second.
      Leveraged ClickHouse for columnar storage and compression, enabling fast analytical
      queries over tens of millions of records.
      Implemented scalable ingestion pipelines, efficient querying APIs,
      and automated data lifecycle management.
    technologies:
      - Java
      - JavaScript
      - Python
      - Go
      - Spring
      - React
      - Kubernetes
      - Apache Spark
      - Apache Kafka
      - ClickHouse
      - MariaDB

  - title: ENTERPRISE SUPPORT CENTER CMS FOR US-BASED MANUFACTURER
    description: |
      Designed and delivered a scalable content management system for a US-based
      enterprise manufacturer.
      Enabled secure content authoring and high-performance content delivery using
      Elasticsearch-backed APIs and cloud-native infrastructure.
    technologies:
      - AWS
      - Java
      - Spring Boot
      - Guice
      - RxJava
      - Elasticsearch
      - MySQL
      - Docker
      - Node.js

  - title: BACKEND ARCHITECTURE FOR LARGE-SCALE TRAVEL SEARCH PLATFORM
    description: |
      Defined the backend architecture for a multi-provider travel search platform
      aggregating flights, trains, and bus services across Europe.
      Introduced microservices-based design and advanced caching strategies
      to reduce external API load and improve response times.
    technologies:
      - Java
      - Guice
      - RxJava
      - Kafka
      - gRPC
      - Docker

