summary: |
  Staff Backend Engineer with 15+ years of experience designing, evolving, and scaling
  distributed systems used by global enterprise customers.
  Proven technical owner of complex, cross-team initiatives, specializing in
  event-driven architectures, data-intensive platforms, and cloud-native systems.
  Strong Kotlin/Java background with a focus on reliability, scalability,
  and long-term maintainability.

accomplishments:
  - title: PLATFORM-WIDE REPORTING REDESIGN FOR GLOBAL VMS
    description: |
      Owned the technical vision and execution of a platform-wide reporting subsystem
      for a global Vendor Management System serving 10k–100k+ users, including Fortune 500 clients.
      Replaced a memory-heavy synchronous export model with a resilient, asynchronous,
      streaming-based architecture capable of handling large-scale data exports with minimal
      memory footprint. Defined extensible report configuration (dynamic columns, ordering,
      renaming) and delivered the solution incrementally with zero customer disruption.
      Established the new design as a long-term platform standard.
    technologies:
      - Kotlin
      - Java
      - Spring
      - PostgreSQL
      - Kafka
      - ActiveMQ
      - Kubernetes
      - GraphQL

  - title: HIGH-THROUGHPUT TELECOMMUNICATIONS TRACE ANALYTICS PLATFORM
    description: |
      Designed and built a high-throughput analytics platform processing thousands of
      telecommunications trace events per second. Leveraged ClickHouse for columnar storage
      and compression, enabling sub-second analytical queries over tens of millions of records.
      Delivered scalable ingestion pipelines, efficient querying, and reliable long-term storage.
    technologies:
      - Java
      - JavaScript
      - Python
      - Go
      - Spring
      - React
      - Kubernetes
      - Apache Spark
      - Apache Kafka
      - ClickHouse
      - MariaDB

  - title: ENTERPRISE SUPPORT CENTER CMS FOR US-BASED MANUFACTURER
    description: |
      Designed and delivered a scalable content management platform for a US-based
      enterprise manufacturer. Enabled secure content authoring and high-performance
      content delivery using Elasticsearch-backed APIs and cloud-native infrastructure.
    technologies:
      - AWS
      - Java
      - Spring Boot
      - Guice
      - RxJava
      - Elasticsearch
      - MySQL
      - Docker
      - Node.js

  - title: BACKEND ARCHITECTURE FOR LARGE-SCALE TRAVEL SEARCH PLATFORM
    description: |
      Defined the backend architecture for a multi-provider travel search platform
      aggregating flights, trains, and bus services across Europe.
      Introduced microservices-based design, advanced caching strategies,
      and ML-assisted optimization to reduce external API load and improve response times.
    technologies:
      - Java
      - Guice
      - RxJava
      - Kafka
      - gRPC
      - Docker

