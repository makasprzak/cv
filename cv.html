<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maciej Kasprzak - CV</title>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #ffffff;
            color: #1F2933;
            line-height: 1.6;
            font-size: 13px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        /* Header */
        header {
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #1F2933;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: #6B7280;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .contact-info a {
            color: #2F5DA8;
            text-decoration: none;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        /* Summary */
        .summary {
            margin-bottom: 35px;
            padding: 15px;
            background-color: #fafafa;
            border-left: 3px solid #2F5DA8;
        }

        /* Section Headers */
        h2 {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 20px;
            margin-top: 35px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e0e0e0;
            color: #1F2933;
        }

        /* Accomplishments */
        .accomplishment {
            margin-bottom: 25px;
            padding-left: 15px;
            border-left: 2px solid #e8e8e8;
        }

        .accomplishment h3 {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #1F2933;
        }

        .accomplishment p {
            margin-bottom: 10px;
            text-align: justify;
            color: #1F2933;
        }

        /* Experience */
        .job {
            margin-bottom: 30px;
            padding-left: 15px;
            border-left: 2px solid #e8e8e8;
        }

        .job-header {
            margin-bottom: 10px;
        }

        .job-title {
            font-weight: bold;
            font-size: 13px;
            color: #1F2933;
        }

        .job-company {
            font-weight: bold;
            color: #2F5DA8;
        }

        .job-meta {
            color: #6B7280;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .job-description {
            margin-bottom: 8px;
            text-align: justify;
            color: #1F2933;
        }

        /* Lists */
        ul {
            margin-left: 20px;
            margin-bottom: 10px;
        }

        ul li {
            margin-bottom: 4px;
            color: #1F2933;
        }

        ul li::marker {
            color: #2F5DA8;
        }

        /* Technologies */
        .technologies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tech-tag {
            background-color: #f0f0f0;
            color: #6B7280;
            padding: 3px 8px;
            font-size: 11px;
            border: 1px solid #d8d8d8;
        }

        /* Education */
        .education-item {
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 2px solid #e8e8e8;
        }

        .degree {
            font-weight: bold;
            font-size: 13px;
            color: #1F2933;
            margin-bottom: 5px;
        }

        .institution {
            color: #6B7280;
            margin-bottom: 5px;
        }

        .thesis-title {
            font-style: italic;
            margin-top: 8px;
            margin-bottom: 5px;
            color: #1F2933;
        }

        .thesis-description {
            text-align: justify;
            color: #1F2933;
        }

        /* Loading state */
        #loading {
            text-align: center;
            padding: 40px;
            color: #6B7280;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 22px;
            }

            .contact-info {
                flex-direction: column;
                gap: 8px;
            }
        }

        @media print {
            body {
                background-color: white;
                font-size: 11px;
            }

            .container {
                box-shadow: none;
                max-width: 100%;
                padding: 0;
            }

            h1 {
                font-size: 24px;
            }

            h2 {
                font-size: 14px;
                page-break-after: avoid;
            }

            .job, .accomplishment, .education-item {
                page-break-inside: avoid;
            }

            .job-header {
                page-break-after: avoid;
            }

            .tech-tag {
                border: 1px solid #999;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .summary {
                page-break-after: avoid;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            a {
                color: #2F5DA8;
                text-decoration: none;
            }

            /* Ensure colors are preserved in print */
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">Loading CV...</div>
        <div id="content" style="display: none;"></div>
    </div>

    <script>
        async function loadCV() {
            try {
                const response = await fetch('cv.yaml');
                const yamlText = await response.text();
                const data = jsyaml.load(yamlText);
                renderCV(data);
            } catch (error) {
                document.getElementById('loading').innerHTML =
                    'Error loading CV data. Please ensure cv.yaml is in the same directory.';
                console.error('Error:', error);
            }
        }

        function renderCV(data) {
            const content = document.getElementById('content');

            let html = `
                <header>
                    <h1>${data.personal_info.name}</h1>
                    <div class="contact-info">
                        <span>${data.personal_info.phone}</span>
                        <span><a href="mailto:${data.personal_info.email}">${data.personal_info.email}</a></span>
                        <span><a href="https://${data.personal_info.github}" target="_blank">${data.personal_info.github}</a></span>
                    </div>
                </header>

                <div class="summary">
                    <strong>${data.personal_info.title}</strong>
                    ${data.summary.trim()}
                </div>

                <h2>SELECTED ACCOMPLISHMENTS</h2>
            `;

            // Accomplishments
            const romanNumerals = ['I', 'II', 'III', 'IV'];
            data.accomplishments.forEach((acc, index) => {
                html += `
                    <div class="accomplishment">
                        <h3>${romanNumerals[index]}. ${acc.title}</h3>
                        <p>${acc.description.trim()}</p>
                        <div class="technologies">
                            ${acc.technologies.map(tech => `<span class="tech-tag">${tech}</span>`).join('')}
                        </div>
                    </div>
                `;
            });

            // Experience
            html += '<h2>EXPERIENCE</h2>';
            data.experience.forEach(job => {
                html += `
                    <div class="job">
                        <div class="job-header">
                            <div class="job-title">
                                ${job.position}${job.responsibilities_note ? ' (' + job.responsibilities_note + ')' : ''} –
                                <span class="job-company">${job.company}</span>
                            </div>
                            <div class="job-meta">
                                ${job.period} | ${job.location}
                            </div>
                        </div>
                `;

                if (job.description) {
                    html += `<div class="job-description">${job.description.trim()}</div>`;
                }

                if (job.achievements && job.achievements.length > 0) {
                    html += '<ul>';
                    job.achievements.forEach(achievement => {
                        html += `<li>${achievement}</li>`;
                    });
                    html += '</ul>';
                }

                html += `
                        <div class="technologies">
                            ${job.technologies.map(tech => `<span class="tech-tag">${tech}</span>`).join('')}
                        </div>
                    </div>
                `;
            });

            // Education
            html += '<h2>EDUCATION</h2>';
            data.education.forEach(edu => {
                html += `
                    <div class="education-item">
                        <div class="degree">${edu.degree}</div>
                        <div class="institution">${edu.institution}</div>
                        <div class="job-meta">${edu.period}</div>
                `;

                if (edu.thesis) {
                    html += `
                        <div class="thesis-title">Masters Thesis: "${edu.thesis.title}"</div>
                        <div class="thesis-description">${edu.thesis.description.trim()}</div>
                    `;
                }

                html += '</div>';
            });

            content.innerHTML = html;
            document.getElementById('loading').style.display = 'none';
            content.style.display = 'block';
        }

        loadCV();
    </script>
</body>
</html>
