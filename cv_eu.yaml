summary: |
  with over 15 years of experience building and evolving
  backend systems for large-scale, business-critical applications.
  Strong background in Kotlin and Java with a focus on distributed systems,
  data-intensive workloads, and long-term system maintainability.
  Experienced in owning complex components within team-based architectures
  and collaborating closely with other teams when changes have wider impact.

accomplishments:
  - title: LARGE-SCALE REPORTING REDESIGN FOR ENTERPRISE VENDOR MANAGEMENT SYSTEM
    description: |
      Led the redesign of a large, business-critical reporting component
      within an enterprise Vendor Management System used by tens of thousands of users.
      Replaced a synchronous, memory-intensive export mechanism with an asynchronous,
      streaming-based approach capable of handling large data volumes reliably.
      Although teams retained ownership of their components, changes to the reporting
      subsystem affected multiple teams and required close coordination.
      The solution was delivered incrementally without disruption to existing users
      and supports flexible report configuration such as column selection,
      ordering, and renaming.
    technologies:
      - Kotlin
      - Java
      - Spring
      - PostgreSQL
      - Kafka
      - ActiveMQ
      - Kubernetes
      - GraphQL

  - title: TELECOMMUNICATIONS TRACE DATA ANALYTICS PLATFORM
    description: |
      Designed and implemented a high-throughput analytics platform for processing
      telecommunications trace data at scale.
      Utilised ClickHouse for columnar storage and compression, enabling fast analytical
      queries over very large datasets.
      Delivered scalable ingestion pipelines, query APIs, and automated data retention
      mechanisms to ensure long-term system stability.
    technologies:
      - Java
      - JavaScript
      - Python
      - Go
      - Spring
      - React
      - Kubernetes
      - Apache Spark
      - Apache Kafka
      - ClickHouse
      - MariaDB

  - title: SUPPORT CENTRE CONTENT MANAGEMENT SYSTEM
    description: |
      Designed and delivered a content management system for a customer support centre
      of a large international manufacturer.
      Enabled secure content authoring and high-performance content delivery using
      Elasticsearch-backed services and cloud-based infrastructure.
    technologies:
      - AWS
      - Java
      - Spring Boot
      - Guice
      - RxJava
      - Elasticsearch
      - MySQL
      - Docker
      - Node.js

  - title: BACKEND ARCHITECTURE FOR TRAVEL SEARCH PLATFORM
    description: |
      Designed backend architecture for a travel search platform aggregating flights,
      trains, and bus services across Europe.
      Introduced a microservices-based design and caching strategies to reduce
      external service calls and improve response times.
    technologies:
      - Java
      - Guice
      - RxJava
      - Kafka
      - gRPC
      - Docker

