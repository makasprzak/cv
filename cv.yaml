accomplishments:
  - title: SCALED ENTERPRISE REPORTING FOR A GLOBAL VMS PLATFORM
    description: |
      Led the redesign of a reporting subsystem for a large-scale Vendor Management System
      serving enterprise clients with tens to hundreds of thousands of users (including AstraZeneca
      and DoorDash). Transformed an unstable, memory-intensive request/response export mechanism
      into a fully resilient, job-based and streaming architecture capable of handling large data
      exports reliably with minimal memory footprint. The redesigned solution supports flexible
      report configuration including column selection, reordering and renaming, and was introduced
      incrementally over several months with zero disruption to end users. The implementation
      emphasizes code reuse, high automated test coverage and long-term maintainability.
    technologies:
      - Kotlin
      - Java
      - Spring
      - PostgreSQL
      - Kafka
      - ActiveMQ
      - Kubernetes
      - GraphQL

  - title: CREATED A TELECOMMUNICATIONS TRACE DATA ANALYZER PLATFORM FOR NOKIA
    description: |
      Created a system capable of processing and persisting thousands of telecommunications trace
      messages per second. Efficient use of the Clickhouse columnar database allows to return
      analytic reports of tens of millions of messages within seconds while ensuring high data
      compression rate.
    technologies:
      - Java
      - JavaScript
      - Python
      - Go Lang
      - Spring
      - React
      - Kubernetes
      - Apache Spark
      - Apache Kafka
      - Clickhouse
      - MariaDB

  - title: CREATED A SUPPORT CENTER CMS FOR A LEADING BEVERAGES MANUFACTURER
    description: |
      Created a content management system for a Support Center of a leading beverages manufacturer
      located in USA. The system allows authorized users to manage articles related to company's
      products and publish them in a highly scalable and performant Elasticsearch based web service.
    technologies:
      - AWS
      - Java 8
      - Spring Boot
      - Guice
      - RxJava
      - Elasticsearch
      - MySQL
      - Docker
      - Node.js

  - title: DESIGNED THE BACK-END ARCHITECTURE FOR A LARGE TRAVEL SEARCH ENGINE
    description: |
      Designed the back-end architecture for a complex travel search site that compares numerous
      European travel services to produce trip results consisting of flights, trains and buses.
      The implemented solution minimizes the query rate to external services using sophisticated
      caching strategies and machine learning. It also ensures modularity by applying the
      microservices approach.
    technologies:
      - Java 8
      - Guice
      - RxJava
      - Kafka
      - gRPC
      - Docker

